apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-demo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  canary-demo.json: |
    {
      "title": "K3s Istio Canary Demo",
      "uid": "k3s-istio-canary",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "title": "HTTP requests per second by version",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (version) (rate(canary_http_requests_total[5m]))", "legendFormat": "{{version}}"}],
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Total requests by version",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (version) (canary_http_requests_total)", "legendFormat": "{{version}}"}],
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0}
        },
        {
          "id": 3,
          "title": "HTTP 4xx/5xx responses",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (version, status) (rate(canary_http_requests_total{status=~\"4..|5..\"}[5m]))", "legendFormat": "{{version}} / {{status}}"}],
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 9}
        }
      ]
    }
