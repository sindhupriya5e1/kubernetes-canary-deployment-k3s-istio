apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
{{- range $variant := list "stable" "canary" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $variant }}-app
  namespace: {{ $.Values.namespace }}
spec:
  replicas: {{ index $.Values $variant "replicas" }}
  selector:
    matchLabels:
      app: canary-demo
      version: {{ $variant }}
  template:
    metadata:
      labels:
        app: canary-demo
        version: {{ $variant }}
    spec:
      containers:
        - name: app
          image: "{{ $.Values.image.repository }}:{{ index $.Values $variant "tag" }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml $.Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $variant }}-app
  namespace: {{ $.Values.namespace }}
spec:
  selector:
    app: canary-demo
    version: {{ $variant }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: {{ $.Values.service.targetPort }}
---
{{- end }}
