name: Canary Demo CI and Container Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/canary-demo

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start application
        run: |
          APP_VERSION=ci PORT=3000 node app/server.js > /tmp/canary-app.log 2>&1 &
          echo $! > /tmp/canary-app.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              break
            fi
            sleep 1
          done

      - name: Verify health and application endpoints
        run: |
          curl --fail http://127.0.0.1:3000/health
          curl --fail http://127.0.0.1:3000/ | grep -q "K3s + Istio canary demo"

      - name: Build stable and canary images
        run: |
          docker build -f docker/Dockerfile -t canary-demo:stable --build-arg APP_VERSION=stable .
          docker build -f docker/Dockerfile -t canary-demo:canary --build-arg APP_VERSION=canary .

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish stable and canary images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          docker tag canary-demo:stable "ghcr.io/$OWNER/canary-demo:stable"
          docker tag canary-demo:canary "ghcr.io/$OWNER/canary-demo:canary"
          docker push "ghcr.io/$OWNER/canary-demo:stable"
          docker push "ghcr.io/$OWNER/canary-demo:canary"
